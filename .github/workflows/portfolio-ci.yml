name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SEMGREP_VERSION: "1.175.0"
  TRIVY_IMAGE: "aquasec/trivy@sha256:7228e304ae0f610a1fad937baa463598cadac0c2ac4027cc68f3a8b997115689"
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy@sha256:65f8bee15a648ca4a0b6a25e1096fc76af6eea42ab2d75f2a9649981225f30b8"

jobs:
  release-integration:
    name: Kubernetes release and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FINGUARD_TEST_REGISTRY_IMAGE: "registry@sha256:7518da9b12dd746278282a729dee2e65eabdeb449db4d0b28d46ef6e90308f58"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project and verified integration tools
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps --editable .
          bash scripts/install_integration_tools.sh "$RUNNER_TEMP/finguard-tools"
          echo "$RUNNER_TEMP/finguard-tools" >> "$GITHUB_PATH"
      - name: Verify actual release, rollback, signing failure and SIGTERM recovery
        run: make integration-release PYTHON=python
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finguard-kubernetes-release
          path: build/integration-release/
          if-no-files-found: error
          retention-days: 14

  quality-and-demo:
    name: Quality and E2E gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install project
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps --editable .

      - name: Run quality checks
        id: quality
        continue-on-error: true
        run: make quality PYTHON=python QUALITY_REPORT_DIR=build/public-ci/reports

      - name: Run passing and blocked scenarios
        if: steps.quality.outcome == 'success'
        env:
          FINGUARD_PYTHON: python
        run: ./scripts/demo.sh --skip-tests

      - name: Preserve local gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finguard-local-gate-evidence
          path: build/
          if-no-files-found: warn
          retention-days: 14

      - name: Install pinned Semgrep
        run: |
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install "semgrep==$SEMGREP_VERSION"

      - name: Require shared quality reports
        run: |
          test -s build/public-ci/reports/junit.xml
          test -s build/public-ci/reports/coverage.xml
          test -s build/public-ci/reports/ruff.json
          mkdir -p build/public-ci/zap

      - name: Run Semgrep SAST
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config .semgrep/secure-coding.yml \
            --metrics=off \
            --json \
            --output build/public-ci/reports/semgrep.json \
            .

      - name: Run Trivy SCA and create CycloneDX SBOM
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$TRIVY_IMAGE" fs \
            --skip-dirs build \
            --scanners vuln,misconfig,license \
            --license-full \
            --format json \
            --output build/public-ci/reports/trivy.json \
            .
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$TRIVY_IMAGE" fs \
            --skip-dirs build \
            --format cyclonedx \
            --output build/public-ci/reports/sbom.cdx.json \
            .

      - name: Run OWASP ZAP DAST against the sample service
        run: |
          cp config/zap-rules.conf build/public-ci/zap/zap-rules.conf
          chmod 0777 build/public-ci/zap
          python -m sample_service.app > build/public-ci/sample-service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          python scripts/wait_for_http.py http://127.0.0.1:8080/health --timeout 30
          set +e
          docker run --rm \
            --network host \
            --volume "$PWD/build/public-ci/zap:/zap/wrk:rw" \
            "$ZAP_IMAGE" zap-baseline.py \
            -t http://127.0.0.1:8080/api/v1/version \
            -c zap-rules.conf \
            -J zap.json
          zap_status=$?
          set -e
          test "$zap_status" -le 2
          cp build/public-ci/zap/zap.json build/public-ci/reports/zap.json

      - name: Evaluate the real reports with FinGuard
        run: |
          gate_status=0
          python -m finguard gate \
            --policy policies/merge-request.toml \
            --reports build/public-ci/reports \
            --output build/public-ci/evidence \
            || gate_status=$?
          test "$gate_status" -eq 0 || test "$gate_status" -eq 2
          python -m finguard verify \
            --evidence build/public-ci/evidence \
            --allow-unsigned
          exit "$gate_status"

      - name: Preserve scanner reports and gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finguard-real-security-reports
          path: build/public-ci/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce quality check outcome
        if: always() && steps.quality.outcome != 'success'
        run: exit 1

  # Preserve the existing required check name while executing scanners and tests
  # once in the shared workspace above.
  security-gate:
    name: Real SAST, SCA and DAST
    needs: quality-and-demo
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the combined quality and security result
        env:
          COMBINED_RESULT: ${{ needs.quality-and-demo.result }}
        run: test "$COMBINED_RESULT" = success
