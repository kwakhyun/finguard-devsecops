[metadata]
id = "FIN-SW-DEVSECOPS-MR"
version = "5.1.1"
name = "MR 변경 검증 정책"
owner = "SW Quality Engineering"

[gates]
required_categories = ["lint", "test", "sast", "sca"]
required_scanners = ["ruff", "junit", "coverage.py", "semgrep", "trivy", "cyclonedx"]
block_severities = ["critical", "high"]
min_coverage_percent = 85.0
max_test_failures = 0
minimum_test_count = 1
fail_on_scanner_error = true
fail_on_unknown_severity = true
require_fixes_for_blocking_vulnerabilities = true
minimum_sbom_components = 1

[gates.max_findings]
medium = 0
low = 10
unknown = 0

[licenses]
allowed = ["0BSD", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "OFL-1.1", "Python-2.0"]
denied = ["AGPL-3.0-only", "AGPL-3.0-or-later", "GPL-3.0-only", "SSPL-1.0"]
review_required = ["GPL-2.0-only", "LGPL-2.1-only", "LGPL-3.0-only", "MPL-2.0"]
allow_unknown = false

[change]
required = false
allowed_types = ["CB", "SR"]
minimum_approvals = 0
require_rollback_plan = false
require_separation_of_duties = false
require_deployment_window = false
maximum_deployment_window_hours = 24
maximum_evidence_age_hours = 24
approval_roles = []
require_approval_after_build = false
require_approval_attestation = false
allowed_approval_issuers = []
allowed_approval_key_ids = []
allowed_approval_signature_methods = ["hmac-sha256", "cosign"]

[provenance]
require_release_subject = false
require_scan_attestations = false
require_signed_attestations = false
max_report_age_hours = 24
clock_skew_minutes = 5
artifact_bound_categories = []
allowed_runner_ids = []
allowed_key_ids = []
require_database_for_scanners = []

[exception_controls]
allowed_categories = ["lint", "sast", "sca", "dast", "iac"]
non_exceptionable_severities = ["critical"]
max_validity_days = 14
max_renewals = 0
min_reason_length = 20
require_compensating_controls = true
require_scope = true

[vex]
accepted_states = ["not_affected", "false_positive", "resolved"]
require_justification = true
minimum_detail_length = 20
require_signed_attestation = true
allowed_issuers = ["vex://security-review"]
allowed_key_ids = ["onprem-vex-cosign-v1"]
allowed_signature_methods = ["cosign"]
max_validity_days = 14
non_suppressible_severities = ["critical"]
