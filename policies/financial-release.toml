[exception_controls]
allowed_categories = ["lint", "sast", "sca", "dast", "iac"]
non_exceptionable_severities = ["critical"]
max_validity_days = 30
max_renewals = 0
min_reason_length = 20
require_compensating_controls = true
require_scope = true

[vex]
accepted_states = ["not_affected", "false_positive", "resolved"]
require_justification = true
minimum_detail_length = 20
require_signed_attestation = true
allowed_issuers = ["vex://security-review"]
allowed_key_ids = ["onprem-vex-cosign-v1"]
allowed_signature_methods = ["cosign"]
max_validity_days = 30
non_suppressible_severities = ["critical"]
