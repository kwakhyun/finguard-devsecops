name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SEMGREP_VERSION: "1.175.0"
  TRIVY_IMAGE: "aquasec/trivy@sha256:7228e304ae0f610a1fad937baa463598cadac0c2ac4027cc68f3a8b997115689"
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy@sha256:65f8bee15a648ca4a0b6a25e1096fc76af6eea42ab2d75f2a9649981225f30b8"

jobs:
  quality-and-demo:
    name: Quality and E2E gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install project
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps --editable .

      - name: Run quality checks
        run: make quality PYTHON=python

      - name: Run passing and blocked scenarios
        env:
          FINGUARD_PYTHON: python
        run: ./scripts/demo.sh

      - name: Preserve local gate evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: finguard-local-gate-evidence
          path: build/
          if-no-files-found: warn
          retention-days: 14

  security-gate:
    name: Real SAST, SCA and DAST
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install project and pinned Semgrep
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps --editable .
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install "semgrep==$SEMGREP_VERSION"

      - name: Generate quality reports
        run: |
          mkdir -p build/public-ci/reports build/public-ci/zap
          ruff check . --exit-zero --output-format=json --output-file=build/public-ci/reports/ruff.json
          pytest --junitxml=build/public-ci/reports/junit.xml \
            --cov=finguard --cov-report=xml:build/public-ci/reports/coverage.xml

      - name: Run Semgrep SAST
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config .semgrep/secure-coding.yml \
            --metrics=off \
            --error \
            --json \
            --output build/public-ci/reports/semgrep.json \
            .

      - name: Run Trivy SCA and create CycloneDX SBOM
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$TRIVY_IMAGE" fs \
            --skip-dirs build \
            --scanners vuln,misconfig,license \
            --license-full \
            --format json \
            --output build/public-ci/reports/trivy.json \
            .
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$TRIVY_IMAGE" fs \
            --skip-dirs build \
            --format cyclonedx \
            --output build/public-ci/reports/sbom.cdx.json \
            .

      - name: Run OWASP ZAP DAST against the sample service
        run: |
          cp config/zap-rules.conf build/public-ci/zap/zap-rules.conf
          chmod 0777 build/public-ci/zap
          python -m sample_service.app > build/public-ci/sample-service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          python scripts/wait_for_http.py http://127.0.0.1:8080/health --timeout 30
          set +e
          docker run --rm \
            --network host \
            --volume "$PWD/build/public-ci/zap:/zap/wrk:rw" \
            "$ZAP_IMAGE" zap-baseline.py \
            -t http://127.0.0.1:8080/api/v1/version \
            -c zap-rules.conf \
            -J zap.json
          zap_status=$?
          set -e
          test "$zap_status" -le 2
          cp build/public-ci/zap/zap.json build/public-ci/reports/zap.json

      - name: Evaluate the real reports with FinGuard
        run: |
          python -m finguard gate \
            --policy policies/merge-request.toml \
            --reports build/public-ci/reports \
            --output build/public-ci/evidence
          python -m finguard verify \
            --evidence build/public-ci/evidence \
            --allow-unsigned

      - name: Preserve scanner reports and gate evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: finguard-real-security-reports
          path: build/public-ci/
          if-no-files-found: error
          retention-days: 14
