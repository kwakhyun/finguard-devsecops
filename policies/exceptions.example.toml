# 예외는 탐지 결과의 fingerprint 단위로만 허용한다. 담당자와 승인자는 달라야 하며,
# 만료된 예외는 자동으로 차단된다. 아래 예시의 주석을 해제해 사용한다.
#
# [[exceptions]]
# id = "EXC-2026-0042"
# fingerprint = "<64-character finding fingerprint>"
# reason = "상용 모듈 호환성 문제로 즉시 패치할 수 없어 네트워크 격리로 임시 완화"
# owner = "service-owner@company.example"
# approver = "security-reviewer@company.example"
# created_at = 2026-09-01T00:00:00Z
# expires_at = 2026-09-30T23:59:59Z
# ticket = "RISK-2026-0042"
# category = "sca"
# severity = "high"
# service = "service-name"
# environment = "production"
# policy_id = "FIN-SW-DEVSECOPS-RELEASE"
# policy_version = "5.1.1"
# compensating_controls = "외부 접속을 허용 목록으로 제한하고 일일 탐지 보고서를 검토한다."
# renewal_count = 0
# revoked = false
